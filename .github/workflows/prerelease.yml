name: prerelease

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - ".github"
      - "README.md"
    tags-ignore:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Build WebUI
        working-directory: webui
        run: |
          npm ci
          npm run build

      - name: Run build.sh
        run: sh build.sh

      - name: Delete current prerelease assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view Prerelease >/dev/null 2>&1; then
            echo "Prerelease does not exist yet, nothing to delete."
            exit 0
          fi
          gh release view Prerelease --json assets --jq '.assets[].name' | while read -r asset; do
            echo "Deleting asset: $asset"
            gh release delete-asset Prerelease "$asset" --yes < /dev/null
          done

      - name: Tag Repo
        uses: richardsimko/update-tag@v3
        with:
          tag_name: Prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Prerelease
        uses: softprops/action-gh-release@v3
        if: ${{ success() }}
        with:
          tag_name: Prerelease
          files: box4_v*.zip
          prerelease: true
          generate_release_notes: true
